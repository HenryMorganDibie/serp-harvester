<!DOCTYPE html>
<!--
  Synthetic fixture, not captured Google markup: js_results.html plus the
  no-JavaScript fallback of a JS check (a noscript meta refresh to
  /httpservice/retry/enablejs), the shape documented in README "Live
  mode". A plain HTTP fetch sees only the fallback; a browser runs the
  script and gets the three results.
-->
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rendered results fixture</title></head>
<body>
  <noscript><meta http-equiv="refresh" content="0;url=/httpservice/retry/enablejs?sei=fixture"><div>If you are not redirected, <a href="/httpservice/retry/enablejs?sei=fixture">click here</a>.</div></noscript>
  <div id="search"></div>
  <div id="probe"></div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var q = params.get("q") || "";
      var search = document.getElementById("search");
      for (var i = 1; i <= 3; i++) {
        var r = document.createElement("div");
        r.className = "organic-result";
        r.innerHTML =
          '<a class="organic-link" href="https://example.com/' + i + '">' +
          '<h3 class="organic-title">Result ' + i + ' for ' + q.replace(/</g, "") + '</h3></a>' +
          '<span class="organic-snippet">Rendered client-side.</span>';
        search.appendChild(r);
      }
      var probe = document.getElementById("probe");
      probe.setAttribute("data-q", q);
      probe.setAttribute("data-language", navigator.language);
      probe.setAttribute("data-width", String(window.innerWidth));
      probe.setAttribute("data-touch", String(navigator.maxTouchPoints > 0));
    })();
  </script>
</body>
</html>
