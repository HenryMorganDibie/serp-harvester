# Full self-hosted stack: harvester + api (job submission) + redis
# (distributed queue) + postgres (persistent storage) + prometheus (metrics
# scraping + alerting rules) + grafana (dashboards). Run from the repo root:
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# This is what answers "could you deploy and maintain the solution on our
# servers, rather than Apify or an external hosted API" concretely: this
# compose file *is* that deployment, running entirely on infrastructure you
# control. Swap `mode: mock` in config.yaml for `mode: provider` (with an
# API key) or `mode: live` once you're ready to point it at a real target.
#
# Data (Redis stream, Postgres rows, Grafana dashboards state) persists
# across `docker compose down` / `up` via the named volumes below — only
# `docker compose down -v` removes it. See deploy/BACKUP.md for backing it
# up beyond that.
#
# `deploy.resources.limits` below is enforced by `docker compose up` on
# recent Compose V2 (confirmed on Docker Desktop 4.82 / Compose in this
# repo's dev environment); older Compose versions historically only applied
# `deploy:` under Swarm — verify with `docker compose config` on your own
# Compose version if limits matter for capacity planning.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harvester
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_DB: serp_harvester
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvester -d serp_harvester"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped

  harvester:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      # Set when using `mode: provider` — never bake real keys into the
      # image or commit them; pass at runtime (or via `env_file: .env`).
      SERPAPI_KEY: "${SERPAPI_KEY:-}"
      # The DSN deliberately carries no password: pgx fills it in from
      # PGPASSWORD, so the credential never appears inside a URL.
      POSTGRES_DSN: "postgres://harvester@postgres:5432/serp_harvester?sslmode=disable"
      PGPASSWORD: "${POSTGRES_PASSWORD:?}"
    ports:
      - "9090:9090" # Prometheus metrics + /healthz, if metrics_addr is set in config.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    restart: unless-stopped

  # Opt-in headless-browser harvester (mode: playwright). Not started by a
  # plain `up`; run `docker compose -f deploy/docker-compose.yml --profile
  # playwright up -d`. It refuses to fetch until HARVESTER_REVIEWED_TOS=true
  # is set in .env, because it sends real requests to live_endpoint.
  harvester-playwright:
    profiles: ["playwright"]
    build:
      context: ..
      dockerfile: deploy/playwright.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./config.playwright.yaml:/app/config.yaml:ro
    command:
      - "-config=/app/config.yaml"
      - "-i-have-reviewed-tos=${HARVESTER_REVIEWED_TOS:-false}"
    environment:
      POSTGRES_DSN: "postgres://harvester@postgres:5432/serp_harvester?sslmode=disable"
      PGPASSWORD: "${POSTGRES_PASSWORD:?}"
    # Chromium uses /dev/shm heavily; Docker's 64MB default crashes tabs.
    shm_size: "1gb"
    # Reaps Chromium's helper processes and forwards SIGTERM for a clean
    # browser shutdown.
    init: true
    stop_grace_period: 45s # > request_timeout, so in-flight pages drain
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp is enough for /healthz.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # The DSN deliberately carries no password: pgx fills it in from
      # PGPASSWORD, so the credential never appears inside a URL.
      POSTGRES_DSN: "postgres://harvester@postgres:5432/serp_harvester?sslmode=disable"
      PGPASSWORD: "${POSTGRES_PASSWORD:?}"
    command:
      - "-addr=:8080"
      - "-redis-addr=redis:6379"
      - "-redis-stream=serp-harvester:queries"
      - "-postgres-dsn-env=POSTGRES_DSN"
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      - harvester
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
