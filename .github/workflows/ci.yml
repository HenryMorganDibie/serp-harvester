name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Redis and PostgreSQL, so the store and pipeline integration tests
    # run instead of skipping.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harvester
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: serp_harvester
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U harvester -d serp_harvester" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Driver + Chromium for the Playwright fetcher's browser tests (see
      # the script for why it doesn't use playwright-go's own installer).
      # The tests only render local fixtures; nothing contacts Google.
      - name: install Playwright Chromium
        run: sh scripts/install-playwright.sh --with-deps
      - run: go test ./... -v
        env:
          SERP_HARVESTER_PLAYWRIGHT: "1"
          INTEGRATION: "1"
          REDIS_ADDR: "localhost:6379"
          POSTGRES_TEST_DSN: "postgres://harvester:ci-only@localhost:5432/serp_harvester?sslmode=disable"
      - run: go build -o bin/harvester ./cmd/harvester
      - name: run mock harvest end to end
        run: ./bin/harvester -config configs/config.example.yaml -mode mock
      # The crawl binary against a throwaway local site: robots.txt obeyed,
      # one link followed, one JSON line per page on stdout.
      - name: run crawl end to end against a local site
        run: |
          site=$(mktemp -d)
          mkdir -p "$site/p" "$site/private"
          printf '<html><head><title>Home</title></head><body><a href="p/1.html">one</a><a href="private/x.html">x</a></body></html>' > "$site/index.html"
          printf '<html><head><title>One</title></head><body><h1>One</h1></body></html>' > "$site/p/1.html"
          printf '<html><head><title>Private</title></head></html>' > "$site/private/x.html"
          printf 'User-agent: *\nDisallow: /private/\n' > "$site/robots.txt"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$site" >/dev/null 2>&1 &
          sleep 1
          go build -o bin/crawl ./cmd/crawl
          ./bin/crawl -url http://127.0.0.1:8765/ -depth 1 -i-have-reviewed-tos > pages.jsonl
          cat pages.jsonl
          test "$(wc -l < pages.jsonl)" -eq 2
          grep -q '"title":"One"' pages.jsonl
          ! grep -q '"title":"Private"' pages.jsonl
