name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Driver + Chromium for the Playwright fetcher's browser tests (see
      # the script for why it doesn't use playwright-go's own installer).
      # The tests only render local fixtures; nothing contacts Google.
      - name: install Playwright Chromium
        run: sh scripts/install-playwright.sh --with-deps
      - run: go test ./... -v
        env:
          SERP_HARVESTER_PLAYWRIGHT: "1"
      - run: go build -o bin/harvester ./cmd/harvester
      - name: run mock harvest end to end
        run: ./bin/harvester -config configs/config.example.yaml -mode mock
