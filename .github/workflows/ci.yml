name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -v
      - run: go build -o bin/harvester ./cmd/harvester
      - name: run mock harvest end to end
        run: ./bin/harvester -config configs/config.example.yaml -mode mock
